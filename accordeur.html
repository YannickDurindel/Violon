<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accordeur — Violon</title>
<style>
  :root {
    --bg: #1a1410;
    --panel: #241c16;
    --panel-raised: #2c2219;
    --rule: #c98a3f;
    --rule-dim: rgba(201, 138, 63, 0.35);
    --text: #f3ead9;
    --muted: #a6927c;
    --good: #6fae7f;
    --bad: #c15c53;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #2a1f16 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Avenir Next", "Century Gothic", Futura, ui-sans-serif, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .stage {
    width: 100%;
    max-width: 440px;
  }

  nav.site {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    background: var(--panel);
    border-radius: 10px;
    padding: 4px;
  }

  nav.site a {
    flex: 1;
    text-align: center;
    padding: 9px 10px;
    border-radius: 7px;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    text-decoration: none;
    color: var(--muted);
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  nav.site a.current {
    background: var(--rule);
    color: #241c16;
  }

  nav.site a:not(.current):hover {
    color: var(--text);
  }

  .card {
    position: relative;
    background: var(--panel);
    padding: 3px;
    border-radius: 14px;
  }

  /* purfling: the thin double-line inlay near a violin's edge, echoed as the card's frame */
  .card::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid var(--rule-dim);
    border-radius: 10px;
    pointer-events: none;
  }

  .card-inner {
    padding: 34px 32px 28px;
    text-align: center;
  }

  .eyebrow {
    margin: 0 0 6px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--rule);
  }

  .subtitle {
    margin: 0 0 30px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .note-display {
    font-family: "Big Caslon", Didot, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    font-size: 6rem;
    font-weight: 500;
    line-height: 1;
    margin: 4px 0 2px;
    color: var(--text);
    transition: color 0.2s ease;
    text-wrap: balance;
  }

  .note-display .octave {
    font-size: 2rem;
    vertical-align: super;
    font-weight: 400;
    color: var(--muted);
  }

  .note-display.in-tune { color: var(--good); }

  .freq {
    font-size: 1.05rem;
    color: var(--muted);
    margin: 0 0 30px;
    min-height: 1.4em;
    font-variant-numeric: tabular-nums;
  }

  .string-meter {
    margin: 0 auto 8px;
    max-width: 340px;
  }

  .string-line {
    position: relative;
    height: 2px;
    background: linear-gradient(90deg, var(--rule-dim), var(--rule), var(--rule-dim));
    border-radius: 2px;
  }

  .string-line .tick {
    position: absolute;
    top: -3px;
    width: 1px;
    height: 8px;
    background: var(--rule-dim);
  }
  .string-line .tick.mid { left: 50%; height: 12px; top: -5px; background: var(--muted); }
  .string-line .tick.lo { left: 0%; }
  .string-line .tick.hi { left: 100%; }

  .peg-bead {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--rule);
    border: 2px solid var(--panel);
    box-shadow: 0 0 0 1px var(--rule-dim);
    transform: translate(-50%, -50%);
    transition: left 0.08s linear, background-color 0.15s ease;
  }
  .peg-bead.good { background: var(--good); }
  .peg-bead.bad { background: var(--bad); }

  .meter-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    color: var(--muted);
    max-width: 340px;
    margin-left: auto;
    margin-right: auto;
  }

  .cents {
    margin-top: 10px;
    font-size: 0.9rem;
    color: var(--muted);
    min-height: 1.3em;
    font-variant-numeric: tabular-nums;
  }

  .controls {
    margin-top: 30px;
  }

  button {
    background: var(--rule);
    color: #241c16;
    border: none;
    padding: 13px 30px;
    border-radius: 9px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: transform 0.1s ease, background-color 0.2s ease;
  }
  button:hover { background: #dc9c50; }
  button:active { transform: scale(0.97); }
  button:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 3px;
  }
  button.stop {
    background: var(--bad);
    color: var(--text);
  }
  button.stop:hover { background: #cf6a61; }

  .status {
    margin-top: 14px;
    font-size: 0.82rem;
    color: var(--muted);
    min-height: 1.2em;
  }

  .pegbox {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 26px;
    padding-top: 22px;
    border-top: 1px solid var(--rule-dim);
  }

  .peg-tag {
    font-size: 0.76rem;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--panel-raised);
    color: var(--muted);
    transition: background-color 0.15s ease, color 0.15s ease;
    font-variant-numeric: tabular-nums;
  }
  .peg-tag.active {
    background: var(--rule);
    color: #241c16;
    font-weight: 600;
  }

  @media (prefers-reduced-motion: reduce) {
    .peg-bead, .note-display, button, .peg-tag { transition: none; }
  }

  @media (max-width: 380px) {
    .note-display { font-size: 4.6rem; }
    .card-inner { padding: 28px 20px 22px; }
  }
</style>
</head>
<body>
<div class="stage">
  <nav class="site">
    <a href="accordeur.html" class="current">Accordeur</a>
    <a href="gammes.html">Gammes</a>
  </nav>

  <div class="card">
    <div class="card-inner">
      <p class="eyebrow">Accordeur</p>
      <p class="subtitle">Écoute le violon par le micro et indique la note jouée</p>

      <div class="note-display" id="noteDisplay">–</div>
      <div class="freq" id="freqDisplay">&nbsp;</div>

      <div class="string-meter">
        <div class="string-line">
          <span class="tick lo"></span>
          <span class="tick mid"></span>
          <span class="tick hi"></span>
          <span class="peg-bead" id="peg"></span>
        </div>
        <div class="meter-labels">
          <span>−50¢</span>
          <span>juste</span>
          <span>+50¢</span>
        </div>
        <div class="cents" id="centsDisplay">&nbsp;</div>
      </div>

      <div class="controls">
        <button id="toggleBtn" type="button">Démarrer le micro</button>
        <div class="status" id="status">Cliquez pour autoriser le micro et commencer.</div>
      </div>

      <div class="pegbox">
        <span class="peg-tag" data-note="G3">Sol · G3</span>
        <span class="peg-tag" data-note="D4">Ré · D4</span>
        <span class="peg-tag" data-note="A4">La · A4</span>
        <span class="peg-tag" data-note="E5">Mi · E5</span>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const NOTE_NAMES = ["Do", "Do#", "Ré", "Ré#", "Mi", "Fa", "Fa#", "Sol", "Sol#", "La", "La#", "Si"];
  const A4 = 440;

  const noteDisplay = document.getElementById('noteDisplay');
  const freqDisplay = document.getElementById('freqDisplay');
  const centsDisplay = document.getElementById('centsDisplay');
  const peg = document.getElementById('peg');
  const toggleBtn = document.getElementById('toggleBtn');
  const statusEl = document.getElementById('status');
  const pegTags = document.querySelectorAll('.peg-tag');

  let audioCtx, analyser, mediaStream, source, rafId;
  let running = false;

  toggleBtn.addEventListener('click', () => {
    if (!running) start(); else stop();
  });

  async function start() {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }
      });
    } catch (err) {
      statusEl.textContent = "Impossible d'accéder au micro : " + err.message;
      return;
    }

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    source = audioCtx.createMediaStreamSource(mediaStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 4096;
    source.connect(analyser);

    running = true;
    toggleBtn.textContent = "Arrêter";
    toggleBtn.classList.add('stop');
    statusEl.textContent = "Écoute en cours… jouez une note.";
    update();
  }

  function stop() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
    if (audioCtx) audioCtx.close();
    toggleBtn.textContent = "Démarrer le micro";
    toggleBtn.classList.remove('stop');
    statusEl.textContent = "Arrêté.";
    noteDisplay.textContent = "–";
    noteDisplay.classList.remove('in-tune');
    freqDisplay.innerHTML = "&nbsp;";
    centsDisplay.innerHTML = "&nbsp;";
    peg.style.left = "50%";
    peg.classList.remove('good', 'bad');
    pegTags.forEach(t => t.classList.remove('active'));
  }

  const buf = new Float32Array(4096);

  function update() {
    if (!running) return;
    analyser.getFloatTimeDomainData(buf);
    const freq = autoCorrelate(buf, audioCtx.sampleRate);

    if (freq === -1) {
      freqDisplay.innerHTML = "&nbsp;";
    } else {
      renderNote(freq);
    }
    rafId = requestAnimationFrame(update);
  }

  // Autocorrelation pitch detection (ACF2+ style, with lag search capped to
  // the violin's practical range so it doesn't burn cycles on periods that
  // could never correspond to a playable note).
  function autoCorrelate(buffer, sampleRate) {
    const SIZE = buffer.length;
    let rms = 0;
    for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
    rms = Math.sqrt(rms / SIZE);
    if (rms < 0.01) return -1; // too quiet

    let r1 = 0, r2 = SIZE - 1;
    const threshold = 0.2;
    for (let i = 0; i < SIZE / 2; i++) {
      if (Math.abs(buffer[i]) < threshold) { r1 = i; break; }
    }
    for (let i = 1; i < SIZE / 2; i++) {
      if (Math.abs(buffer[SIZE - i]) < threshold) { r2 = SIZE - i; break; }
    }
    const trimmed = buffer.slice(r1, r2);
    const newSize = trimmed.length;

    const maxLag = Math.min(newSize - 1, Math.floor(sampleRate / 80));

    const c = new Array(maxLag + 1).fill(0);
    for (let lag = 0; lag <= maxLag; lag++) {
      for (let i = 0; i < newSize - lag; i++) {
        c[lag] += trimmed[i] * trimmed[i + lag];
      }
    }

    let d = 0;
    while (d < maxLag && c[d] > c[d + 1]) d++;

    let maxVal = -1, maxPos = -1;
    for (let i = d; i <= maxLag; i++) {
      if (c[i] > maxVal) { maxVal = c[i]; maxPos = i; }
    }
    let T0 = maxPos;

    if (T0 > 0 && T0 < maxLag) {
      const x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
      const a = (x1 + x3 - 2 * x2) / 2;
      const b = (x3 - x1) / 2;
      if (a !== 0) T0 = T0 - b / (2 * a);
    }

    if (T0 <= 0) return -1;
    return sampleRate / T0;
  }

  function freqToNote(freq) {
    const noteNum = 12 * (Math.log(freq / A4) / Math.log(2));
    const rounded = Math.round(noteNum) + 69; // MIDI number, A4 = 69
    const cents = Math.floor((noteNum - Math.round(noteNum)) * 100);
    return { midi: rounded, cents };
  }

  function midiToLabel(midi) {
    const name = NOTE_NAMES[midi % 12];
    const octave = Math.floor(midi / 12) - 1;
    return { name, octave };
  }

  function midiToFreq(midi) {
    return A4 * Math.pow(2, (midi - 69) / 12);
  }

  const violinStrings = {
    'G3': midiToFreq(55),
    'D4': midiToFreq(62),
    'A4': midiToFreq(69),
    'E5': midiToFreq(76)
  };

  function renderNote(freq) {
    const { midi, cents } = freqToNote(freq);
    const { name, octave } = midiToLabel(midi);

    noteDisplay.innerHTML = `${name}<span class="octave">${octave}</span>`;
    freqDisplay.textContent = freq.toFixed(1) + " Hz";
    centsDisplay.textContent = (cents > 0 ? "+" : "") + cents + " cents";

    const clamped = Math.max(-50, Math.min(50, cents));
    const pct = 50 + clamped;
    peg.style.left = pct + "%";

    const inTune = Math.abs(cents) <= 5;
    noteDisplay.classList.toggle('in-tune', inTune);
    peg.classList.toggle('good', inTune);
    peg.classList.toggle('bad', !inTune);

    let closestKey = null, closestDiff = Infinity;
    for (const key in violinStrings) {
      const diff = Math.abs(violinStrings[key] - freq);
      if (diff < closestDiff) { closestDiff = diff; closestKey = key; }
    }
    pegTags.forEach(tag => {
      tag.classList.toggle('active', tag.dataset.note === closestKey && closestDiff < 15);
    });
  }
})();
</script>
</body>
</html>
